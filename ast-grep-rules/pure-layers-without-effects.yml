id: pure-layers-without-effects
language: rust
severity: error
message: The model and view layers stay free of effects.
note: Read files, devices, the clock and the bus in a runtime or a subscription source, and pass the result in as a message; time arrives as a value.
files:
  - bootvine/src/boot_model.rs
  - bootvine/src/boot_model/**/*.rs
  - bootvine/src/boot_view.rs
  - bootvine/src/boot_view/**/*.rs
  - bootvine/src/screen_components.rs
  - bootvine/src/screen_components/**/*.rs
rule:
  any:
    - kind: scoped_identifier
      regex: ^(::)?(std::(fs|env|process|thread|net|os::unix|time::(Instant|SystemTime))|tokio|rustix|dbus|systemd|crossterm)(::|$)
    - kind: scoped_use_list
      has:
        field: path
        regex: ^(::)?(tokio|rustix|dbus|systemd|crossterm|std::os::unix)$
    - kind: identifier
      regex: ^(fs|env|process|thread|net)$
      inside:
        kind: use_list
        inside:
          kind: scoped_use_list
          has:
            field: path
            regex: ^(::)?std$
    - kind: identifier
      regex: ^(Instant|SystemTime)$
      inside:
        kind: use_list
        inside:
          kind: scoped_use_list
          has:
            field: path
            regex: ^(::)?std::time$
    - kind: scoped_identifier
      regex: ^(fs|env|process|thread|net|os::unix)(::|$)
      inside:
        kind: use_list
        inside:
          kind: scoped_use_list
          has:
            field: path
            regex: ^(::)?std$
    - kind: await_expression
    - kind: unsafe_block
    - kind: function_modifiers
      regex: \basync\b
    - pattern: monotonic_now()
