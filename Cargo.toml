[workspace]
members = ["bootvine", "bootvine-screen", "bootvine-systemd-link", "scripted-demos", "xtask"]
resolver = "3"

[workspace.lints.clippy]
absolute_paths = "warn"
disallowed_methods = "deny"
disallowed_types = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_for_each = "allow"
pedantic = { priority = -1, level = "warn" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = true
