[package]
categories = ["os::linux-apis"]
description = "The systemd side of bootvine: the job feed over systemd's private socket, journal lines, the password agent and the switch to the real root"
edition = "2024"
include = ["/src", "/LICENSE"]
keywords = ["systemd", "boot", "initrd", "tui", "console"]
license = "GPL-3.0-or-later"
name = "bootvine-systemd-link"
readme = "../README.md"
repository = "https://codeberg.org/wvhulle/bootvine"
rust-version = "1.95"
version = "0.1.3"

[lints]
workspace = true

[dependencies]
bootvine-screen = { version = "0.1.3", path = "../bootvine-screen" }
futures = { version = "0.3.34", default-features = false, features = [
  "std",
  "async-await",
] }
rust-ini = "0.21.3"
rustix = { version = "1.1.5", features = [
  "event",
  "fs",
  "process",
  "stdio",
  "system",
  "termios",
  "time",
] }
sdjournal = "=0.1.15"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
strip-ansi-escapes = "0.2.1"
thiserror = "2.0.12"
tokio = { version = "1.54.0", default-features = false, features = [
  "io-util",
  "rt",
  "time",
  "net",
  "signal",
] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
zbus = { version = "6.3.0", default-features = false, features = ["tokio", "p2p"] }
zeroize = "1.9.1"
