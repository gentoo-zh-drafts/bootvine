default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: rustfmt-formatting
        name: rustfmt formatting
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: ast-grep-rules
        name: ast-grep design rules
        entry: sh -c 'ast-grep test --skip-snapshot-tests && ast-grep scan --error'
        language: system
        pass_filenames: false
