[package]
categories = ["command-line-utilities", "os::linux-apis"]
description = "Boot and shutdown progress for systemd or OpenRC on the console, with each job nested under the units waiting on it"
edition = "2024"
include = ["/src", "/system-files", "/LICENSE"]
keywords = ["systemd", "boot", "initrd", "tui", "console"]
license = "GPL-3.0-or-later"
name = "bootvine"
readme = "../README.md"
repository = "https://codeberg.org/wvhulle/bootvine"
rust-version = "1.95"
version = "0.1.4"

[lints]
workspace = true

[features]
default = ["systemd"]
openrc = ["dep:bootvine-openrc-link"]
systemd = ["dep:bootvine-systemd-link"]

[dependencies]
bootvine-openrc-link = { version = "0.1.3", path = "../bootvine-openrc-link", optional = true }
bootvine-screen = { version = "0.1.3", path = "../bootvine-screen" }
bootvine-systemd-link = { version = "0.1.3", path = "../bootvine-systemd-link", optional = true }
clap = { version = "4.6.7", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
] }
crossterm = "0.29.0"
inotify = "0.11.5"
futures = { version = "0.3.34", default-features = false, features = [
  "std",
  "async-await",
] }
jiff = { version = "0.2.38", default-features = false, features = [
  "serde",
  "std",
] }
ratatui = { version = "0.30.2", features = [
  "serde",
  "unstable-rendered-line-info",
] }
rustix = { version = "1.1.5", features = [
  "event",
  "fs",
  "process",
  "stdio",
  "system",
  "termios",
  "time",
] }
ser_nix = "0.2.4"
thiserror = "2.0.12"
tokio = { version = "1.54.0", default-features = false, features = [
  "rt",
  "time",
  "net",
  "signal",
] }
toml = { version = "1.1.8", features = ["preserve_order"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
