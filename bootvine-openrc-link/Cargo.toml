[package]
categories = ["os::linux-apis"]
description = "The OpenRC side of bootvine: service state changes under /run/openrc turned into the boot tree"
edition = "2024"
include = ["/src", "/LICENSE"]
keywords = ["openrc", "boot", "init", "tui", "console"]
license = "GPL-3.0-or-later"
name = "bootvine-openrc-link"
readme = "../README.md"
repository = "https://codeberg.org/wvhulle/bootvine"
rust-version = "1.91"
version = "0.1.4"

[lints]
workspace = true

[dependencies]
bootvine-screen = { version = "0.1.4", path = "../bootvine-screen" }
futures = { version = "0.3.34", default-features = false, features = [
  "std",
  "async-await",
] }
inotify = "0.11.5"
rustix = { version = "1.1.5", features = ["time"] }
thiserror = "2.0.12"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.54.0", default-features = false, features = [
  "rt",
  "time",
  "net",
] }
