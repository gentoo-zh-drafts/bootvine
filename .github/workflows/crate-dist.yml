
name: Create crate dist
on:
  push:
    tags:
      - '**'

jobs:
  crate-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create crate dist
        uses: liangyongxiang/crate-dist-action@master
        with:
          directories: bootvine
          dist-filename: bootvine-0.1.2-crates.tar.xz
          run-cargo-update: false

