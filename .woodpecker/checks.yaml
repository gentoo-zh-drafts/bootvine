when:
  - repo: wvhulle/bootvine
    event: [pull_request, push, manual]

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      build-users-group =
      accept-flake-config = true
  - &after_dependency_step
    - status: [success, failure]

steps:
  - name: prepare-build-dependencies
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix develop --quiet --command nu tasks/nix-built-paths.nu build-unless-cached .#packages.x86_64-linux.bootvine-dependencies

  - name: build-and-test-bootvine
    image: nixos/nix:latest
    depends_on: [prepare-build-dependencies]
    when: *after_dependency_step
    environment: *nix_config
    commands:
      - nix develop --quiet --command nu tasks/nix-built-paths.nu import-exported-paths
      - nix develop --quiet --command nu tasks/nix-built-paths.nu build-and-export-paths .#checks.x86_64-linux.build-bootvine

  - name: lint-with-clippy
    image: nixos/nix:latest
    depends_on: [prepare-build-dependencies]
    when: *after_dependency_step
    environment: *nix_config
    commands:
      - nix develop --quiet --command nu tasks/nix-built-paths.nu import-exported-paths
      - nix build --quiet --print-build-logs .#checks.x86_64-linux.lint-clippy

  - name: upload-builds-to-cachix
    image: nixos/nix:latest
    depends_on: [build-and-test-bootvine]
    when:
      - event: [push, manual]
        branch: main
        status: [success, failure]
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix develop --quiet --command nu tasks/nix-built-paths.nu upload-exported-paths

  - name: run-pre-commit-hooks
    image: nixos/nix:latest
    depends_on: [prepare-build-dependencies]
    when: *after_dependency_step
    environment: *nix_config
    commands:
      - nix develop --quiet --command prek run --all-files --show-diff-on-failure

  - name: evaluate-flake-outputs
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix flake check --quiet --no-build

  - name: check-commit-messages
    image: nixos/nix:latest
    depends_on: []
    when:
      - event: pull_request
    environment: *nix_config
    commands:
      - nix develop --quiet --command nu tasks/release-tasks.nu check-commit-messages --fetch-target-branch FETCH_HEAD..HEAD

  - name: check-release-pr-is-current
    image: nixos/nix:latest
    depends_on: []
    when:
      - event: pull_request
        evaluate: 'CI_COMMIT_SOURCE_BRANCH startsWith "release-plz-"'
    environment: *nix_config
    commands:
      - nix develop --quiet --command nu tasks/release-tasks.nu check-release-pr-is-current
