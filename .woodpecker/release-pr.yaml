when:
  - repo: wvhulle/bootvine
    event: [push, manual]
    branch: main

clone:
  - name: clone-with-history
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      partial: false
      tags: true

steps:
  - name: open-or-update-release-pr
    image: nixos/nix:latest
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        build-users-group =
        accept-flake-config = true
      GIT_AUTHOR_NAME: release-plz
      GIT_AUTHOR_EMAIL: willemvanhulle@protonmail.com
      GIT_COMMITTER_NAME: release-plz
      GIT_COMMITTER_EMAIL: willemvanhulle@protonmail.com
      CODEBERG_TOKEN:
        from_secret: bot_token
    commands:
      - nix develop --quiet .#ci-cargo --command nu tasks/release-tasks.nu open-or-update-release-pr
